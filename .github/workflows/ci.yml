name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Typecheck, test, build
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Node 22 provides node:sqlite for the D1 list tests.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bunx vite build

  docker:
    runs-on: ubuntu-latest
    name: Docker image (as Render builds it)
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t powerean .
      - name: Smoke test
        run: |
          docker run -d --name pe -p 10000:10000 powerean
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:10000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:10000/ | grep -q "EAN-skanner"
