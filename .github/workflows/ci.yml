name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Typecheck, test, build
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Node 22 provides node:sqlite for the D1 list tests.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build (as the Higgsfield deploy does)
        env:
          HF_DESIGN_INSPECTOR: "1"
        run: bunx vite build
