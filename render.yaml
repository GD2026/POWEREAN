# Render Blueprint: one free web service, built from the Dockerfile.
# One-click setup: https://render.com/deploy?repo=https://github.com/GD2026/POWEREAN
services:
  - type: web
    name: powerean
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
